<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 245" width="740" height="245" style="font-family:Inter,Helvetica,Arial,sans-serif"><rect x="10" y="40" width="190" height="120" rx="10" fill="#f3efe6" stroke="#d9d2c3" stroke-width="1.5"/><text x="105" y="75" font-size="16" font-weight="700" fill="#1d2433" text-anchor="middle">Context</text><text x="105" y="105" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">“The best way to</text><text x="105" y="125" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">get started is…”</text><line x1="205" y1="100" x2="250" y2="100" stroke="#b8893b" stroke-width="2"/><polygon points="250,100 241,95 241,105" fill="#b8893b"/><rect x="255" y="20" width="240" height="160" rx="10" fill="#ffffff" stroke="#d9d2c3" stroke-width="1.5"/><text x="375" y="45" font-size="14" font-weight="700" fill="#1d2433" text-anchor="middle">The model calculates</text><text x="375" y="63" font-size="14" font-weight="700" fill="#1d2433" text-anchor="middle">probabilities</text><text x="275" y="97" font-size="13" font-weight="400" fill="#1d2433" text-anchor="start">to</text><rect x="355" y="85" width="115" height="15" rx="3" fill="#b8893b"/><text x="470" y="97" font-size="12" font-weight="600" fill="#6b7280" text-anchor="end">41%</text><text x="275" y="120" font-size="13" font-weight="400" fill="#1d2433" text-anchor="start">simply</text><rect x="355" y="108" width="62" height="15" rx="3" fill="#d9d2c3"/><text x="470" y="120" font-size="12" font-weight="600" fill="#6b7280" text-anchor="end">22%</text><text x="275" y="143" font-size="13" font-weight="400" fill="#1d2433" text-anchor="start">by</text><rect x="355" y="131" width="48" height="15" rx="3" fill="#d9d2c3"/><text x="470" y="143" font-size="12" font-weight="600" fill="#6b7280" text-anchor="end">17%</text><text x="275" y="166" font-size="13" font-weight="400" fill="#1d2433" text-anchor="start">…</text><rect x="355" y="154" width="56" height="15" rx="3" fill="#d9d2c3"/><text x="470" y="166" font-size="12" font-weight="600" fill="#6b7280" text-anchor="end">20%</text><line x1="500" y1="100" x2="545" y2="100" stroke="#b8893b" stroke-width="2"/><polygon points="545,100 536,95 536,105" fill="#b8893b"/><rect x="550" y="40" width="180" height="120" rx="10" fill="#1d2433" stroke="#1d2433" stroke-width="1.5"/><text x="640" y="92" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">It picks a token</text><text x="640" y="115" font-size="13" font-weight="400" fill="#e9e3d6" text-anchor="middle">and repeats the cycle</text><path d="M640 165 C640 215, 105 215, 105 165" fill="none" stroke="#b8893b" stroke-width="2" stroke-dasharray="6 5"/><text x="372" y="232" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">one token at a time, until the answer is complete</text></svg>